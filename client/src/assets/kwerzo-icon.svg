<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB9176"/>
      <stop offset="1" stop-color="#F4754F"/>
    </linearGradient>
    <linearGradient id="kmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE0D6"/>
      <stop offset="1" stop-color="#52C2B8"/>
    </linearGradient>
  </defs>

  <!-- tile base with bottom-edge depth -->
  <rect x="14" y="26" width="484" height="484" rx="92" fill="#D85F3E"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="url(#tile)"/>
  <!-- top-left highlight -->
  <rect x="46" y="46" width="180" height="46" rx="23" fill="#ffffff" opacity="0.18"/>

  <!-- K mark: vertical bar + left-pointing chevron (matches the reference tile) -->
  <g>
    <!-- drop shadow of mark -->
    <g transform="translate(8 12)" opacity="0.22">
      <rect x="120" y="146" width="74" height="220" rx="30" fill="#1b6a63"/>
      <path d="M 330 152
               C 344 146 362 150 372 164
               C 382 178 380 196 366 208
               L 280 256
               L 366 304
               C 380 316 382 334 372 348
               C 362 362 344 366 330 360
               L 206 286
               C 190 276 190 236 206 226
               Z" fill="#1b6a63"/>
    </g>

    <rect x="120" y="146" width="74" height="220" rx="30" fill="url(#kmark)"/>
    <path d="M 330 152
             C 344 146 362 150 372 164
             C 382 178 380 196 366 208
             L 280 256
             L 366 304
             C 380 316 382 334 372 348
             C 362 362 344 366 330 360
             L 206 286
             C 190 276 190 236 206 226
             Z" fill="url(#kmark)"/>
    <!-- highlight stripe on the bar -->
    <rect x="132" y="158" width="20" height="196" rx="10" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>
