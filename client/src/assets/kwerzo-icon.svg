<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="kgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="105" fill="none" stroke="rgba(124,58,237,0.35)" stroke-width="3"/>

  <!-- Decorative tile shapes (echoing the game's shape set) -->
  <g opacity="0.9">
    <!-- star, top right -->
    <path d="M 384 96 L 393 116 L 415 119 L 399 134 L 403 156 L 384 145 L 365 156 L 369 134 L 353 119 L 375 116 Z" fill="#43A047"/>
    <!-- hex, bottom left -->
    <path d="M 124 372 l 20 -11 l 20 11 l 0 23 l -20 11 l -20 -11 Z" fill="#8E24AA"/>
    <!-- heart-ish dot, bottom right -->
    <circle cx="392" cy="404" r="13" fill="#E91E63"/>
    <!-- leaf-ish, top left -->
    <path d="M 110 122 q 26 -22 28 14 q -36 6 -28 -14 Z" fill="#1E88E5"/>
  </g>

  <!-- Bold K mark -->
  <g transform="translate(256 256)">
    <path d="M -86 -120 L -40 -120 L -40 -16 L 64 -120 L 122 -120 L 18 -16
             L 128 120 L 70 120 L -16 14 L -40 38 L -40 120 L -86 120 Z"
          fill="url(#kgrad)" />
  </g>
</svg>
