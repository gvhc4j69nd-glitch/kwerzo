<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB9176"/>
      <stop offset="1" stop-color="#F4754F"/>
    </linearGradient>
    <linearGradient id="kmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE0D6"/>
      <stop offset="1" stop-color="#52C2B8"/>
    </linearGradient>
  </defs>

  <!-- mark: coral tile with teal K, matching app icon -->
  <g transform="translate(20 20)">
    <rect x="0" y="12" width="200" height="200" rx="38" fill="#D85F3E"/>
    <rect x="0" y="0" width="200" height="200" rx="38" fill="url(#tile)"/>
    <rect x="13" y="13" width="74" height="19" rx="9.5" fill="#ffffff" opacity="0.18"/>

    <g transform="translate(15 8) scale(0.405)">
      <g transform="translate(8 12)" opacity="0.22">
        <rect x="120" y="146" width="74" height="220" rx="30" fill="#1b6a63"/>
        <path d="M 330 152 C 344 146 362 150 372 164 C 382 178 380 196 366 208 L 280 256 L 366 304 C 380 316 382 334 372 348 C 362 362 344 366 330 360 L 206 286 C 190 276 190 236 206 226 Z" fill="#1b6a63"/>
      </g>
      <rect x="120" y="146" width="74" height="220" rx="30" fill="url(#kmark)"/>
      <path d="M 330 152 C 344 146 362 150 372 164 C 382 178 380 196 366 208 L 280 256 L 366 304 C 380 316 382 334 372 348 C 362 362 344 366 330 360 L 206 286 C 190 276 190 236 206 226 Z" fill="url(#kmark)"/>
      <rect x="132" y="158" width="20" height="196" rx="10" fill="#ffffff" opacity="0.25"/>
    </g>
  </g>

  <!-- wordmark text -->
  <text x="270" y="158" font-family="'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="-3" fill="#e8e8f0">Kwerzo</text>
  <rect x="270" y="178" width="92" height="10" rx="5" fill="url(#kmark)"/>
</svg>
